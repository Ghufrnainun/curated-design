name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci || npm install

      - name: Test
        run: npm test

      - name: Build data from markdown
        run: npm run build

      - name: Verify generated data
        run: |
          node -e "
            const fs = require('fs');
            const js = fs.readFileSync('src/data.js', 'utf8');
            const m = js.match(/window\.DESIGN_DATA = (.*);/s);
            if (!m) throw new Error('data.js malformed');
            const d = JSON.parse(m[1]);
            const total = Object.values(d).reduce((s, a) => s + a.length, 0);
            console.log('OK:', total, 'entries');
            if (total < 100) throw new Error('too few entries');
          "

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy src --project-name=design-ghuf-app --branch=${{ github.ref_name }}